[project]
name = "foreman"
version = "0.1.0"
description = "AI intake agent for contractors: messy leads in, structured job details out."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.50",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["foreman"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
