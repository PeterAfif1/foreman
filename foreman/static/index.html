<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foreman</title>
<style>
  :root {
    --bg: #f6f5f2; --panel: #fff; --text: #1d1d1b; --muted: #6b6a66; --line: #e3e1db;
    --accent: #c2410c; --accent-ink: #fff; --ok: #15803d; --warn: #b45309; --bad: #b91c1c;
    --chip: #f0eee8; --focus: #2563eb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161614; --panel: #201f1d; --text: #ecebe7; --muted: #a3a19b; --line: #34332f;
      --accent: #f97316; --accent-ink: #1a1a1a; --ok: #4ade80; --warn: #fbbf24; --bad: #f87171;
      --chip: #2a2926;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
    padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { margin: 0; font-size: 18px; }
  #stats { color: var(--muted); font-size: 13px; }
  main { display: grid; grid-template-columns: 340px 1fr; min-height: calc(100vh - 53px); }
  aside { border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; }
  .new { padding: 14px; border-bottom: 1px solid var(--line); }
  .new textarea { width: 100%; min-height: 80px; }
  .row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  .row input { flex: 1; min-width: 0; }
  .tabs { display: flex; border-bottom: 1px solid var(--line); }
  .tabs button { flex: 1; background: none; border: 0; padding: 10px; color: var(--muted);
    border-bottom: 2px solid transparent; font: inherit; cursor: pointer; }
  .tabs button.on { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
  #list { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; }
  #list li { padding: 12px 14px; border-bottom: 1px solid var(--line); cursor: pointer; }
  #list li:hover { background: var(--chip); }
  #list li.on { background: var(--chip); box-shadow: inset 3px 0 0 var(--accent); }
  #list .snippet { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  #list .meta { color: var(--muted); font-size: 12px; margin-top: 4px; display: flex; gap: 6px; flex-wrap: wrap; }
  .empty { padding: 24px 14px; color: var(--muted); }
  section { padding: 20px 24px; max-width: 820px; }
  .message { background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 14px 16px; white-space: pre-wrap; word-break: break-word; }
  .message-meta { color: var(--muted); font-size: 12px; margin: 6px 0 18px; }
  form { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 18px; }
  .full { grid-column: 1 / -1; }
  label { display: block; font-size: 12px; font-weight: 600; color: var(--muted);
    text-transform: uppercase; letter-spacing: .04em; margin-bottom: 4px; }
  input, select, textarea { width: 100%; font: inherit; color: var(--text); background: var(--panel);
    border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
  input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  textarea { resize: vertical; }
  .jobs { display: flex; flex-wrap: wrap; gap: 6px; }
  .jobs label { display: inline-flex; align-items: center; gap: 6px; text-transform: none; letter-spacing: 0;
    font-weight: 400; font-size: 14px; color: var(--text); background: var(--chip);
    padding: 5px 10px; border-radius: 999px; margin: 0; cursor: pointer; }
  .jobs input { width: auto; }
  .hint { font-size: 13px; color: var(--muted); margin-top: 6px; }
  .hint button { margin-left: 6px; }
  .changed { border-color: var(--warn); box-shadow: 0 0 0 1px var(--warn); }
  .switch { display: flex; gap: 6px; }
  .switch button { flex: 1; }
  button { font: inherit; border-radius: 6px; padding: 8px 14px; cursor: pointer; white-space: nowrap;
    border: 1px solid var(--line); background: var(--panel); color: var(--text); }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  button.small { padding: 2px 8px; font-size: 12px; }
  button.sel { background: var(--text); color: var(--bg); border-color: var(--text); }
  button:disabled { opacity: .5; cursor: default; }
  .actions { display: flex; gap: 10px; align-items: center; margin-top: 20px; }
  .badge { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; background: var(--chip); }
  .badge.emergency { background: var(--bad); color: #fff; }
  .badge.soon { background: var(--warn); color: #fff; }
  .badge.approved { color: var(--ok); }
  .badge.error { color: var(--bad); }
  #status { color: var(--muted); font-size: 13px; }
  .banner { padding: 10px 14px; border-radius: 6px; margin-bottom: 14px; background: var(--chip); }
  .back { display: none; margin-bottom: 12px; }
  @media (max-width: 760px) {
    main { grid-template-columns: 1fr; }
    aside { border-right: 0; }
    body.detail aside { display: none; }
    body:not(.detail) #detail { display: none; }
    .back { display: inline-block; }
    section { padding: 16px; }
    form { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header>
  <h1>Foreman</h1>
  <span id="stats"></span>
</header>
<main>
  <aside>
    <div class="new">
      <label for="new-text">New lead</label>
      <textarea id="new-text" placeholder="Paste a text, email or call note"></textarea>
      <div class="row">
        <input type="date" id="new-date" aria-label="Received on">
        <button class="primary" id="new-btn">Read it</button>
      </div>
    </div>
    <div class="tabs" role="tablist">
      <button class="on" data-status="pending">To review</button>
      <button data-status="approved">Approved</button>
    </div>
    <ul id="list"></ul>
  </aside>
  <section id="detail">
    <p class="empty">Pick a lead on the left, or paste a new one.</p>
  </section>
</main>

<template id="detail-tpl">
  <button class="back" type="button">Back to list</button>
  <div class="banner" hidden></div>
  <div class="message"></div>
  <div class="message-meta"></div>
  <form>
    <div class="full">
      <label>Is this a real lead?</label>
      <div class="switch">
        <button type="button" data-lead="true">Yes, a customer</button>
        <button type="button" data-lead="false">No, spam or wrong number</button>
      </div>
    </div>
    <div><label for="f-name">Name</label><input id="f-name" name="customer_name">
      <div class="hint" hidden></div></div>
    <div><label for="f-contact">Phone or email</label><input id="f-contact" name="contact"></div>
    <div class="full"><label>Job</label><div class="jobs"></div></div>
    <div><label for="f-location">Location</label><input id="f-location" name="location"></div>
    <div><label for="f-urgency">Urgency</label>
      <select id="f-urgency" name="urgency">
        <option value="">Not stated</option>
        <option value="emergency">Emergency</option>
        <option value="soon">Soon</option>
        <option value="flexible">Flexible</option>
      </select></div>
    <div><label for="f-bmin">Budget from ($)</label><input id="f-bmin" name="budget_min" type="number" min="0" step="100"></div>
    <div><label for="f-bmax">Budget up to ($)</label><input id="f-bmax" name="budget_max" type="number" min="0" step="100"></div>
    <div><label for="f-deadline">Deadline</label><input id="f-deadline" name="deadline" type="date"></div>
    <div></div>
    <div class="full"><label for="f-scope">Summary</label><textarea id="f-scope" name="scope_summary" rows="2"></textarea></div>
    <div class="full"><label for="f-missing">Ask the customer (one per line)</label><textarea id="f-missing" name="missing_info" rows="3"></textarea></div>
  </form>
  <div class="actions">
    <button class="primary" type="button" id="approve">Approve</button>
    <span id="status"></span>
  </div>
</template>

<script>
const JOBS = ["kitchen", "bathroom", "roofing", "flooring", "addition", "repair", "other"];
const TEXT_FIELDS = ["customer_name", "contact", "location", "scope_summary", "deadline"];
const NUM_FIELDS = ["budget_min", "budget_max"];
let tab = "pending", leads = [], current = null;

const $ = (sel, root = document) => root.querySelector(sel);
// Everything from the API is set with textContent or .value, never innerHTML:
// lead text comes from strangers.
function el(tag, props = {}, ...kids) {
  const n = document.createElement(tag);
  Object.assign(n, props);
  for (const k of kids) n.append(k);
  return n;
}

async function api(path, opts = {}) {
  const r = await fetch(path, { headers: { "Content-Type": "application/json" }, ...opts });
  if (!r.ok) throw new Error(`${r.status} ${await r.text()}`);
  return r.json();
}

function fmtDate(iso) {
  return new Date(iso + "T12:00:00").toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
}

async function loadStats() {
  const s = await api("/stats");
  const pct = s.approved_without_edits_rate == null ? "" :
    ` · ${Math.round(s.approved_without_edits_rate * 100)}% approved with no fixes`;
  $("#stats").textContent = `${s.total} leads · ${s.pending} to review · ${s.approved} approved${pct}`;
}

async function loadList(selectId) {
  leads = await api(`/leads?status=${tab}`);
  const list = $("#list");
  list.replaceChildren();
  if (!leads.length) {
    list.append(el("li", { className: "empty", textContent: tab === "pending" ? "Nothing to review." : "Nothing approved yet." }));
  }
  for (const l of leads) {
    const lead = l.approved || l.extracted;
    const meta = el("div", { className: "meta" }, el("span", { textContent: fmtDate(l.received_at) }));
    if (l.error) meta.append(el("span", { className: "badge error", textContent: "needs manual entry" }));
    if (lead?.urgency === "emergency" || lead?.urgency === "soon")
      meta.append(el("span", { className: `badge ${lead.urgency}`, textContent: lead.urgency }));
    if (lead && !lead.is_lead) meta.append(el("span", { className: "badge", textContent: "not a lead" }));
    if (l.status === "approved")
      meta.append(el("span", { className: "badge approved",
        textContent: l.edited_fields.length ? `fixed ${l.edited_fields.length}` : "no fixes" }));
    const li = el("li", {}, el("div", { className: "snippet", textContent: l.text }), meta);
    li.dataset.id = l.id;
    li.onclick = () => select(l.id);
    list.append(li);
  }
  if (selectId) select(selectId);
}

function select(id) {
  current = leads.find(l => l.id === id);
  if (!current) return;
  document.querySelectorAll("#list li").forEach(li => li.classList.toggle("on", +li.dataset.id === id));
  document.body.classList.add("detail");
  renderDetail();
}

function renderDetail() {
  const l = current;
  const base = l.extracted || { is_lead: true, job_types: [], missing_info: [] };
  const shown = l.approved || base;
  const done = l.status === "approved";
  const node = $("#detail-tpl").content.cloneNode(true);
  const detail = $("#detail");
  detail.replaceChildren(node);

  $(".back", detail).onclick = () => document.body.classList.remove("detail");
  $(".message", detail).textContent = l.text;
  const metaBits = [`Received ${fmtDate(l.received_at)}`];
  if (l.latency_ms) metaBits.push(`read in ${(l.latency_ms / 1000).toFixed(1)}s`);
  if (l.prompt_version) metaBits.push(`prompt ${l.prompt_version}`);
  $(".message-meta", detail).textContent = metaBits.join(" · ");

  const banner = $(".banner", detail);
  if (l.error) { banner.hidden = false; banner.textContent = "The model couldn't read this one. Fill it in by hand."; }
  if (done) {
    banner.hidden = false;
    banner.textContent = l.edited_fields.length
      ? `Approved. You fixed: ${l.edited_fields.join(", ").replaceAll("_", " ")}.`
      : "Approved with no fixes.";
  }

  const form = $("form", detail);
  for (const f of TEXT_FIELDS) form.elements[f].value = shown[f] ?? "";
  for (const f of NUM_FIELDS) form.elements[f].value = shown[f] ?? "";
  form.elements.urgency.value = shown.urgency ?? "";
  form.elements.missing_info.value = (shown.missing_info || []).join("\n");

  const jobs = $(".jobs", detail);
  for (const j of JOBS) {
    const box = el("input", { type: "checkbox", name: "job", value: j, checked: shown.job_types.includes(j) });
    jobs.append(el("label", {}, box, j));
  }

  let isLead = shown.is_lead;
  const switches = detail.querySelectorAll(".switch button");
  const paintSwitch = () => switches.forEach(b => b.classList.toggle("sel", (b.dataset.lead === "true") === isLead));
  switches.forEach(b => b.onclick = () => { isLead = b.dataset.lead === "true"; paintSwitch(); markChanges(); });
  paintSwitch();

  const hint = $(".hint", detail);
  if (shown.name_hint && !done) {
    hint.hidden = false;
    hint.append(`Maybe ${shown.name_hint} (from their email)`);
    const use = el("button", { type: "button", className: "small", textContent: "Use" });
    use.onclick = () => { form.elements.customer_name.value = shown.name_hint; markChanges(); };
    hint.append(use);
  }

  const read = () => {
    const out = { ...base, is_lead: isLead };
    for (const f of TEXT_FIELDS) out[f] = form.elements[f].value.trim() || null;
    for (const f of NUM_FIELDS) out[f] = form.elements[f].value === "" ? null : Math.round(+form.elements[f].value);
    out.urgency = form.elements.urgency.value || null;
    out.job_types = [...form.querySelectorAll("input[name=job]:checked")].map(b => b.value);
    out.missing_info = form.elements.missing_info.value.split("\n").map(s => s.trim()).filter(Boolean);
    return out;
  };

  // Outline whatever differs from what the model returned, so it's clear what's being fixed.
  function markChanges() {
    if (done) return;
    const now = read();
    for (const f of [...TEXT_FIELDS, ...NUM_FIELDS, "urgency", "missing_info"]) {
      form.elements[f].classList.toggle("changed", JSON.stringify(now[f]) !== JSON.stringify(base[f] ?? (f === "missing_info" ? [] : null)));
    }
    jobs.classList.toggle("changed", JSON.stringify([...now.job_types].sort()) !== JSON.stringify([...base.job_types].sort()));
  }
  form.addEventListener("input", markChanges);
  form.addEventListener("change", markChanges);

  const approve = $("#approve", detail);
  if (done) {
    form.querySelectorAll("input, select, textarea").forEach(i => i.disabled = true);
    switches.forEach(b => b.disabled = true);
    approve.hidden = true;
    return;
  }
  approve.onclick = async () => {
    approve.disabled = true;
    $("#status", detail).textContent = "Saving...";
    try {
      await api(`/leads/${l.id}/approve`, { method: "POST", body: JSON.stringify(read()) });
      const next = leads[leads.findIndex(x => x.id === l.id) + 1];
      await Promise.all([loadList(next?.id), loadStats()]);
      if (!next) { document.body.classList.remove("detail"); $("#detail").replaceChildren(el("p", { className: "empty", textContent: "All caught up." })); }
    } catch (e) {
      $("#status", detail).textContent = `Couldn't save: ${e.message}`;
      approve.disabled = false;
    }
  };
}

document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
  tab = b.dataset.status;
  document.querySelectorAll(".tabs button").forEach(x => x.classList.toggle("on", x === b));
  loadList();
});

$("#new-date").valueAsDate = new Date();
$("#new-btn").onclick = async () => {
  const text = $("#new-text").value.trim();
  if (!text) return;
  const btn = $("#new-btn");
  btn.disabled = true; btn.textContent = "Reading...";
  try {
    const lead = await api("/leads", { method: "POST", body: JSON.stringify({ text, received_at: $("#new-date").value || null }) });
    $("#new-text").value = "";
    tab = "pending";
    document.querySelectorAll(".tabs button").forEach(x => x.classList.toggle("on", x.dataset.status === "pending"));
    await Promise.all([loadList(lead.id), loadStats()]);
  } catch (e) {
    alert(`Couldn't add the lead: ${e.message}`);
  } finally {
    btn.disabled = false; btn.textContent = "Read it";
  }
};

loadList();
loadStats();
</script>
</body>
</html>
