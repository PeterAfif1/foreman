<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Request a quote</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root { --bg: #f6f5f2; --panel: #fff; --text: #1d1d1b; --muted: #6b6a66; --line: #e3e1db;
    --accent: #c2410c; --accent-ink: #fff; --them: #efece6; --focus: #2563eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161614; --panel: #201f1d; --text: #ecebe7; --muted: #a3a19b; --line: #34332f;
      --accent: #f97316; --accent-ink: #1a1a1a; --them: #2b2a27; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 640px; height: 100%; margin: 0 auto; display: flex; flex-direction: column; }
  header { padding: 20px 16px 12px; }
  h1 { margin: 0; font-size: 22px; }
  .note { margin: 6px 0 0; color: var(--muted); font-size: 14px; }
  #log { flex: 1; overflow-y: auto; padding: 8px 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 16px; white-space: pre-wrap; word-break: break-word; }
  .them { align-self: flex-start; background: var(--them); border-bottom-left-radius: 4px; }
  .me { align-self: flex-end; background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 4px; }
  .typing { color: var(--muted); font-size: 14px; }
  form { display: flex; gap: 8px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--line); background: var(--panel); }
  textarea { flex: 1; resize: none; font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; max-height: 140px; }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 12px; padding: 0 18px;
    background: var(--accent); color: var(--accent-ink); cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  textarea:focus, button:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .done { padding: 16px; text-align: center; color: var(--muted); border-top: 1px solid var(--line); }
  .done button { margin-top: 8px; padding: 10px 18px; }
  /* Hidden from people, not from bots that fill every field. */
  .hp { position: absolute; left: -10000px; width: 1px; height: 1px; overflow: hidden; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Tell us about your project</h1>
    <p class="note">You're chatting with an automated assistant. It takes down your job details,
      then someone from the team follows up. It can't give prices or book visits.</p>
  </header>
  <div id="log" aria-live="polite"></div>
  <form id="form">
    <label class="hp" aria-hidden="true">Website <input name="website" tabindex="-1" autocomplete="off"></label>
    <textarea id="input" rows="1" maxlength="1500" placeholder="Type your message" aria-label="Your message" required></textarea>
    <button id="send" type="submit">Send</button>
  </form>
  <div class="done" id="done" hidden>
    <div>This chat is finished. Thanks!</div>
    <button type="button" id="restart">Start a new request</button>
  </div>
</div>
<script>
const GREETING = "Hi! What can we help you with? Tell us about the job in your own words.";
const KEY = "foreman-chat";
const log = document.getElementById("log"), form = document.getElementById("form");
const input = document.getElementById("input"), send = document.getElementById("send");

// The conversation survives a page reload, not a closed tab.
let chat = { id: null, messages: [{ who: "them", text: GREETING }], done: false };
try { chat = JSON.parse(sessionStorage.getItem(KEY)) || chat; } catch {}
const save = () => { try { sessionStorage.setItem(KEY, JSON.stringify(chat)); } catch {} };

function bubble(who, text) {
  const div = document.createElement("div");
  div.className = `msg ${who}`;
  div.textContent = text; // never innerHTML: replies are model output
  log.append(div);
  log.scrollTop = log.scrollHeight;
  return div;
}

function render() {
  log.replaceChildren();
  chat.messages.forEach(m => bubble(m.who, m.text));
  form.hidden = chat.done;
  document.getElementById("done").hidden = !chat.done;
}

input.addEventListener("input", () => { input.style.height = "auto"; input.style.height = input.scrollHeight + "px"; });
input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
});

form.addEventListener("submit", async e => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || send.disabled) return;
  chat.messages.push({ who: "me", text });
  bubble("me", text);
  input.value = ""; input.style.height = "auto";
  send.disabled = true;
  const typing = bubble("them typing", "Typing...");
  try {
    const r = await fetch("/public/chat", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ chat_id: chat.id, message: text, website: form.website.value }),
    });
    const data = r.ok ? await r.json()
      : { chat_id: chat.id, done: false, reply: r.status === 429
          ? "You're sending messages quickly. Please wait a few minutes and try again."
          : "Something went wrong on our side. Please try again in a moment." };
    chat.id = data.chat_id ?? chat.id;
    chat.messages.push({ who: "them", text: data.reply });
    chat.done = data.done;
  } catch {
    chat.messages.push({ who: "them", text: "Couldn't reach us. Check your connection and try again." });
  }
  typing.remove();
  save();
  render();
  send.disabled = false;
  if (!chat.done) input.focus();
});

document.getElementById("restart").onclick = () => {
  chat = { id: null, messages: [{ who: "them", text: GREETING }], done: false };
  save(); render(); input.focus();
};

render();
</script>
</body>
</html>
