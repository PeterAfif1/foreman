name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t foreman .
      # The image must refuse to start without a password.
      - run: |
          if docker run --rm foreman; then echo "started without a password"; exit 1; fi

  # Runs the cheap evals against real models and fails the build if a number
  # crosses its line in eval/thresholds.json (see eval/gate.py). About 1 cent per
  # run. The chat agent eval is slower and pricier, so it stays manual.
  eval:
    needs: test
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      RUN: ci-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Check the API key is set
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then echo "OPENAI_API_KEY secret is missing"; exit 1; fi
      # Two extractor runs, so the gate judges the average instead of one run.
      - run: uv run python -m eval.run_eval --label $RUN-extract-r1
      - run: uv run python -m eval.run_eval --label $RUN-extract-r2
      - run: uv run python -m eval.run_reply_eval --label $RUN-reply
      - run: uv run python -m eval.run_estimate_eval --label $RUN-estimate
      - name: Gate
        run: uv run python -m eval.gate --label $RUN
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: eval/results/*_ci-*.json
